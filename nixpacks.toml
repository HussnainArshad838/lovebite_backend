[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT --worker-class eventlet --workers 1 --timeout 120 --log-level info --access-logfile - --error-logfile - app:app"